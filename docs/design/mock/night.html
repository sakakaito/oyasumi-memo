<!doctype html>
<html lang="ja" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 画面設計のモック。検索結果に出さない -->
<meta name="robots" content="noindex, nofollow">
<title>夜の画面モック｜おやすみメモ</title>
<meta name="description" content="おやすみメモの夜の画面（頭の中を預ける・今日の日記・文字で書く・おやすみ）の見た目と状態を確かめるための設計モックです。">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0f">
<style>
  /* ---- トークン（docs/design/tokens.md の案） ---- */
  :root {
    --n-bg: #0b0b0f;
    --n-surface: #141117;
    --n-surface-2: #1b171b;
    --n-rec-on: #2b241e;
    --n-black: #000000;
    --n-line: #3a3230;
    --n-text: #917e68;
    --n-text-sub: #73644f;
    --n-text-faint: #3d352d;
    --n-warn: #a07f4c;
    --n-focus: #917e68;

    --font: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    --fs-min: 16px; --fs-body: 17px; --fs-lead: 18px; --fs-rec: 20px;
    --lh-body: 1.7; --lh-title: 1.4;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
    --gutter: 16px; --max-w: 560px;
    --tap-min: 44px; --tap: 48px; --tap-gap: 8px; --rec-size: 184px;
    --r-m: 12px; --r-l: 20px; --r-full: 999px;
    --fade-status: 1000ms;
  }
  @media (prefers-reduced-motion: reduce) { :root { --fade-status: 0ms; } }
  /* iPhone のキーボードを暗くする。meta だけでなく CSS でも dark だけにする（light dark にしない）。screens.md 0-3 */
  :root { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--n-bg); color: var(--n-text); }
  body { font: var(--fs-min)/var(--lh-body) var(--font); -webkit-text-size-adjust: 100%; }
  button, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--n-focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- 画面 ---- */
  .screen {
    min-height: 100vh; min-height: 100svh;
    max-width: var(--max-w); margin: 0 auto;
    display: grid; grid-template-rows: auto 1fr auto;
    padding:
      calc(env(safe-area-inset-top) + var(--sp-2))
      calc(env(safe-area-inset-right) + var(--gutter))
      calc(env(safe-area-inset-bottom) + var(--sp-4))
      calc(env(safe-area-inset-left) + var(--gutter));
  }
  .top { display: flex; justify-content: space-between; align-items: center; min-height: var(--tap-min); }
  .text-btn {
    min-height: var(--tap-min); min-width: var(--tap-min); padding: 0 var(--sp-2); margin-left: calc(var(--sp-2) * -1);
    background: none; border: 0; color: var(--n-text); font-size: var(--fs-min);
  }
  .icon-btn {
    width: var(--tap-min); height: var(--tap-min); margin-right: calc(var(--sp-2) * -1);
    display: grid; place-items: center; background: none; border: 0; color: var(--n-text-sub);
  }
  .icon-btn svg { width: 24px; height: 24px; }

  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: var(--sp-5) 0; }
  /* モックは画面を 1 ファイルに並べているため、S4 の見出しは h2 にして h1 を 1 つに保つ（本番は画面ごとに h1 が 1 つ） */
  h1, h2#writeTitle { font-size: var(--fs-lead); font-weight: 500; line-height: var(--lh-title); margin: 0; }
  .sub { margin: var(--sp-2) 0 0; }
  .rec {
    width: var(--rec-size); height: var(--rec-size); margin-top: var(--sp-6);
    border-radius: var(--r-full); border: 1px solid var(--n-line);
    background: var(--n-surface); color: var(--n-text);
    font-size: var(--fs-rec); font-weight: 600; line-height: var(--lh-title);
    transition: background-color 300ms;
  }
  .rec[aria-pressed="true"] { background: var(--n-rec-on); border-color: #4a3f36; }
  /* 状態の表示行：高さを固定して、ボタンの位置が動かないようにする */
  .line { height: calc(var(--fs-min) * var(--lh-body) * 2); margin-top: var(--sp-4); width: 100%; position: relative; }
  .interim, .status { position: absolute; inset: 0; margin: 0; }
  .interim {
    color: var(--n-text-faint); overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .status { opacity: 0; transition: opacity var(--fade-status); }
  .status.show { opacity: 1; transition: none; }
  .hint { margin: var(--sp-2) 0 0; max-width: 20em; }

  /* エラーのカード */
  .err {
    width: 100%; margin-top: var(--sp-4); text-align: left;
    background: var(--n-surface-2); border: 1px solid var(--n-warn); border-radius: var(--r-m);
    padding: var(--sp-4);
  }
  .err h2 { font-size: var(--fs-min); font-weight: 600; color: var(--n-warn); margin: 0 0 var(--sp-2); line-height: var(--lh-title); }
  .err p { margin: 0 0 var(--sp-3); }
  .row { display: flex; gap: var(--tap-gap); }
  .row > * { flex: 1; }

  .btn {
    min-height: var(--tap); padding: 0 var(--sp-4);
    background: var(--n-surface); border: 1px solid var(--n-line); border-radius: var(--r-m);
    color: var(--n-text); font-size: var(--fs-min);
  }
  .btn:disabled { color: var(--n-text-sub); cursor: default; }
  /* 主ボタン：太さと枠で「押せる」を示す。空のあいだは aria-disabled で弱める（disabled 属性は使わない） */
  .btn.primary { font-weight: 600; border-color: var(--n-text-sub); }
  .btn.primary[aria-disabled="true"] { color: var(--n-text-sub); border-color: var(--n-line); cursor: default; }
  .bottom { display: flex; gap: var(--tap-gap); }
  .bottom .btn { flex: 1; }

  /* ---- 下から出るシート（文字で書く／許可の前） ---- */
  dialog.sheet {
    width: 100%; max-width: var(--max-w); margin: auto auto 0; padding: 0;
    max-height: 85vh; max-height: 85svh;
    background: var(--n-surface-2); color: var(--n-text);
    border: 1px solid var(--n-line); border-bottom: 0; border-radius: var(--r-l) var(--r-l) 0 0;
  }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, .6); }
  .sheet-in {
    padding: var(--sp-5) calc(env(safe-area-inset-right) + var(--gutter)) calc(env(safe-area-inset-bottom) + var(--sp-4)) calc(env(safe-area-inset-left) + var(--gutter));
  }
  .sheet h2 { font-size: var(--fs-lead); font-weight: 500; margin: 0 0 var(--sp-3); line-height: var(--lh-title); }
  .sheet p { margin: 0 0 var(--sp-3); }
  .sheet .row { margin-top: var(--sp-4); }

  /* ---- S4 文字で書く画面（全画面・上に寄せる。screens.md 0-3 案1） ---- */
  .write {
    min-height: 100vh; min-height: 100svh;
    max-width: var(--max-w); margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top) + var(--sp-2))
      calc(env(safe-area-inset-right) + var(--gutter))
      calc(env(safe-area-inset-bottom) + var(--sp-4))
      calc(env(safe-area-inset-left) + var(--gutter));
  }
  .write .close { margin-left: 0; margin-right: calc(var(--sp-2) * -1); }
  .write .khint { margin: 0; }
  .write textarea {
    display: block; width: 100%; margin-top: var(--sp-2);
    /* 4 行ぶんで固定。あふれたら欄の中でスクロール（欄が伸びる動きを出さない） */
    height: calc(var(--fs-body) * var(--lh-body) * 4 + var(--sp-3) * 2 + 2px);
    padding: var(--sp-3); resize: none; overflow-y: auto;
    font-size: var(--fs-body); line-height: var(--lh-body);
    color: var(--n-text); background: var(--n-surface);
    border: 1px solid var(--n-line); border-radius: var(--r-m);
    -webkit-appearance: none; appearance: none; box-shadow: none;
    color-scheme: dark;
    caret-color: var(--n-text);
  }
  .write textarea::placeholder { color: var(--n-text-sub); opacity: 1; }
  .write textarea::selection { background: var(--n-rec-on); color: var(--n-text); }
  /* 入力中の印は枠の色で示す（明るい外枠は出さない） */
  .write textarea:focus, .write textarea:focus-visible { outline: none; border-color: var(--n-text-sub); }
  .write .wline { min-height: calc(var(--fs-min) * var(--lh-body)); margin: 0; color: var(--n-warn); }
  .write .wide { display: block; width: 100%; }
  .write details { margin-top: var(--sp-3); }
  .write summary { min-height: var(--tap-min); display: flex; align-items: center; cursor: pointer; }
  .write details p { margin: 0; }

  /* ---- おやすみ（真っ黒） ---- */
  .black {
    position: fixed; inset: 0; z-index: 10; width: 100%; height: 100%;
    background: var(--n-black); border: 0; padding: 0; color: var(--n-text-faint);
    display: grid; place-items: center; text-align: center;
  }
  .black span { display: block; padding: 0 var(--gutter); transition: opacity var(--fade-status); }
  .black .gone { opacity: 0; }

  /* ---- モックの操作（本番には出さない） ---- */
  .mock {
    max-width: var(--max-w); margin: 0 auto; padding: var(--sp-5) var(--gutter) var(--sp-7);
    border-top: 1px dashed var(--n-line);
  }
  .mock h2 { font-size: var(--fs-min); font-weight: 600; margin: 0 0 var(--sp-1); }
  .mock p { margin: 0 0 var(--sp-3); }
  .mock fieldset { border: 1px solid var(--n-line); border-radius: var(--r-m); margin: 0 0 var(--sp-3); padding: var(--sp-2) var(--sp-3) var(--sp-3); }
  .mock legend { padding: 0 var(--sp-1); }
  .mock .chips { display: flex; flex-wrap: wrap; gap: var(--tap-gap); }
  .mock .chips .btn { flex: 0 1 auto; }
  .mock label.radio { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: var(--tap-min); margin-right: var(--sp-4); }
  .mock input[type="radio"], .mock input[type="checkbox"] { width: 20px; height: 20px; accent-color: #73644f; margin: 0; }
  .mock select {
    width: 100%; min-height: var(--tap); padding: 0 var(--sp-3); margin-top: var(--sp-2);
    background: var(--n-surface); border: 1px solid var(--n-line); border-radius: var(--r-m);
  }
</style>
</head>
<body>

<main class="screen" id="screen" aria-labelledby="title">
  <header class="top">
    <button type="button" class="text-btn" id="diaryLink" aria-label="今日の日記へ">今日の日記</button>
    <span id="topSpacer" hidden></span>
    <button type="button" class="icon-btn" id="morningBtn" aria-label="朝の画面へ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
      </svg>
    </button>
  </header>

  <section class="center">
    <h1 id="title">頭の中を預ける</h1>
    <p class="sub" id="sub" hidden></p>
    <button type="button" class="rec" id="rec" aria-pressed="false" aria-label="話して預ける">タップして話す</button>
    <div class="line">
      <p class="interim" id="interim" aria-live="off"></p>
      <p class="status" id="status" role="status"></p>
    </div>
    <p class="hint" id="hint" hidden></p>
    <div class="err" id="err" role="alert" hidden>
      <h2 id="errTitle"></h2>
      <p id="errBody"></p>
      <div class="row">
        <button type="button" class="btn" id="errText">文字で書く</button>
        <button type="button" class="btn" id="errClose">閉じる</button>
      </div>
    </div>
  </section>

  <footer class="bottom">
    <button type="button" class="btn" id="textBtn">文字で書く</button>
    <button type="button" class="btn" id="nextBtn">おやすみ</button>
  </footer>
</main>

<!-- S4 文字で書く画面。夜の画面の中身と差し替える（重ねない・動かさない）。screens.md 0-3 -->
<main class="write" id="write" aria-labelledby="writeTitle" hidden>
  <header class="top">
    <h2 id="writeTitle">文字で預ける</h2>
    <button type="button" class="text-btn close" id="writeClose" aria-label="閉じる">閉じる</button>
  </header>
  <p class="khint" id="kHint" hidden>キーボードのマイクでも入力できます</p>
  <textarea id="text" aria-label="預けたいこと" placeholder="思いついた順に、そのままどうぞ" spellcheck="false" autocomplete="off" enterkeyhint="enter"></textarea>
  <p class="wline" id="writeErr" role="alert"></p>
  <button type="button" class="btn primary wide" id="writeSave" aria-disabled="true">預ける</button>
  <details id="kHelp" hidden>
    <summary>マイクのボタンが出ないときは</summary>
    <p>設定 → 一般 → キーボード →「音声入力」をオンにしてください。</p>
  </details>
</main>

<!-- 方式W：最初のマイク許可の前に出す、暗い予告 -->
<dialog class="sheet" id="perm" aria-labelledby="permTitle">
  <div class="sheet-in">
    <h2 id="permTitle">最初の 1 回だけ</h2>
    <p>マイクの使用を確認する画面が出ます。少し明るい画面なので、目を離して［許可］を押してください。</p>
    <div class="row">
      <button type="button" class="btn" id="permText">文字で書く</button>
      <button type="button" class="btn" id="permGo">続ける</button>
    </div>
  </div>
</dialog>

<!-- S3 おやすみ -->
<button type="button" class="black" id="black" aria-label="預ける画面に戻る" hidden>
  <span id="blackText">おやすみなさい</span>
</button>

<!-- ここから下は、モックの状態を切り替えるための操作。本番の画面には出さない -->
<section class="mock" aria-labelledby="mockTitle">
  <h2 id="mockTitle">モックの操作（本番には出さない）</h2>
  <p>画面のボタンも押せます（録音・保存はしません）。下で方式や状態を切り替えられます。フェーズ2 で作るのは、方式に関係なく「文字で書く」・日記の入口・「預かりました」「日記に残しました」・保存の失敗です。</p>

  <fieldset>
    <legend>音声入力の方式</legend>
    <label class="radio"><input type="radio" name="method" value="W" checked> 方式W（Web Speech API）</label>
    <label class="radio"><input type="radio" name="method" value="K"> 方式K（キーボード）</label>
  </fieldset>

  <fieldset>
    <legend>画面</legend>
    <div class="chips">
      <button type="button" class="btn" data-step="diary">①今日の日記（夜の始まりに出た）</button>
      <button type="button" class="btn" data-step="azukeru">②頭の中を預ける</button>
      <button type="button" class="btn" data-step="oyasumi">③おやすみ</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>状態</legend>
    <div class="chips">
      <button type="button" class="btn" data-state="idle">通常</button>
      <button type="button" class="btn" data-state="recording">録音中</button>
      <button type="button" class="btn" data-state="saved">保存直後</button>
      <button type="button" class="btn" data-state="nothing">聞き取れなかった</button>
      <button type="button" class="btn" data-state="sheet">文字で書く</button>
      <button type="button" class="btn" data-state="perm">許可の前</button>
      <button type="button" class="btn" data-state="error">エラー</button>
    </div>
    <label for="errType" class="vh">エラーの種類</label>
    <select id="errType">
      <option value="service-not-allowed">service-not-allowed（Safari のタブ）</option>
      <option value="service-not-allowed-standalone">service-not-allowed（ホーム画面アプリ）</option>
      <option value="not-allowed">not-allowed</option>
      <option value="audio-capture">audio-capture</option>
      <option value="network">network</option>
      <option value="language-not-supported">language-not-supported</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>そのほか</legend>
    <label class="radio"><input type="checkbox" id="firstNight"> 初めての夜</label>
    <label class="radio"><input type="checkbox" id="failSave"> 文字で書く：次の保存を失敗させる</label>
  </fieldset>
</section>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  const ui = {
    step: 'azukeru',     // diary | azukeru | oyasumi
    entry: 'link',       // S1 への来かた：link（S2 の入口から）| start（夜の始まりに出た。US-13 のあと）
    method: 'W',         // W | K
    firstNight: false,
    permAsked: false,
    failSave: false,     // 文字で書く：次の保存を失敗させる（モックの操作）
  };

  const STEP = {
    diary: {
      title: '今日のこと', sub: '今日あったことを、日記に残せます',
      recLabel: '日記を話す', recStopLabel: '止めて日記に残す', saved: '日記に残しました',
      writeTitle: '文字で日記を書く', writeAria: '今日の日記', writeSave: '日記に残す',
      placeholder: '今日あったことを、そのままどうぞ',
      interim: 'きょうは朝から会議が続いて、お昼を食べそびれた。でも帰りに',
      hintFirst: { W: '今日あったことを、そのまま話してください。止めるときは、もう一度タップ。', K: 'タップすると入力欄が開きます。キーボードのマイクで話せます。' },
    },
    azukeru: {
      title: '頭の中を預ける', sub: '',
      recLabel: '話して預ける', recStopLabel: '止めて預ける', saved: '預かりました',
      writeTitle: '文字で預ける', writeAria: '預けたいこと', writeSave: '預ける',
      placeholder: '思いついた順に、そのままどうぞ',
      interim: 'あしたの朝いちばんに田中さんにメール、それと資料の',
      hintFirst: { W: '浮かんでいることを、そのまま話してください。止めるときは、もう一度タップ。', K: 'タップすると入力欄が開きます。キーボードのマイクで話せます。' },
    },
  };

  // screens.md 0-4 の文言（保存の失敗は S4 の中で出すので、ここには無い）
  const ERRORS = {
    'not-allowed': ['マイクが許可されていません', 'アドレスバー左の「ぁあ」→ Web サイトの設定 → マイク を「許可」にしてから、もう一度タップしてください。'],
    'service-not-allowed': ['iPhone の音声入力が使えませんでした', '設定 → 一般 → キーボード →「音声入力」がオンか確かめてください。スクリーンタイムで Siri と音声入力が制限されていても使えません。'],
    'service-not-allowed-standalone': ['この開き方では、声の入力が使えないようです', '「文字で書く」から、キーボードのマイクで話せます。'],
    'audio-capture': ['マイクを使えませんでした', '通話中か、ほかのアプリがマイクを使っていないか確かめてください。'],
    'network': ['声を文字にできませんでした', '声を文字にするには通信が必要です。「文字で書く」なら、通信がなくても預けられます。'],
    'language-not-supported': ['この端末では日本語の声の入力が使えませんでした', '「文字で書く」から、キーボードのマイクで話せます。'],
  };
  const SAVE_FAILED = '保存できませんでした。文字は残っています';

  let recording = false;
  let statusTimer = 0;
  let blackTimer = 0;
  let savedThisStep = false;
  // 書きかけ：メモ用と日記用で別々に持つ（フェーズ2 はページを開いている間だけ）
  const drafts = { azukeru: '', diary: '' };
  let writeKind = 'azukeru';
  let writeOpener = null;

  // ---- 表示 ----
  function render() {
    const s = STEP[ui.step === 'diary' ? 'diary' : 'azukeru'];
    $('title').textContent = s.title;
    $('sub').textContent = s.sub;
    $('sub').hidden = !s.sub;

    // 左上：預ける画面にだけ日記の入口（文言はいつも「今日の日記」）
    $('diaryLink').hidden = ui.step !== 'azukeru';
    $('topSpacer').hidden = ui.step === 'azukeru';

    // 話すボタン
    const rec = $('rec');
    if (ui.method === 'K') {
      rec.removeAttribute('aria-pressed');
      rec.setAttribute('aria-label', '入力欄を開く');
    } else {
      rec.setAttribute('aria-pressed', String(recording));
      rec.setAttribute('aria-label', recording ? s.recStopLabel : s.recLabel);
    }
    rec.textContent = recording ? '聞いています' : 'タップして話す';

    // ボタンの下の 1 文
    let hint = '';
    if (recording) hint = 'もう一度タップで止まります';
    else if (ui.firstNight) hint = s.hintFirst[ui.method];
    $('hint').textContent = hint;
    $('hint').hidden = !hint || !$('err').hidden; // エラーのカードが出ているときは、案内を重ねない

    // 右下：S1 は来かたで「戻る／とばす」、残したあとは「次へ」。どれも S2 へ
    const next = $('nextBtn');
    if (ui.step === 'diary') {
      const word = savedThisStep ? '次へ' : (ui.entry === 'link' ? '戻る' : 'とばす');
      next.textContent = word;
      next.setAttribute('aria-label', word + '（預ける画面へ）');
    } else {
      next.textContent = 'おやすみ';
      next.setAttribute('aria-label', 'おやすみ：画面を暗くして終える');
    }

    $('black').hidden = ui.step !== 'oyasumi';
  }

  function showStatus(msg) {
    const el = $('status');
    clearTimeout(statusTimer);
    el.textContent = msg;
    el.classList.add('show');
    // 2 秒表示して、1 秒かけて消える
    statusTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }
  function clearStatus() {
    clearTimeout(statusTimer);
    $('status').classList.remove('show');
    $('status').textContent = '';
  }

  function hideError() { $('err').hidden = true; }
  function showError(type) {
    stopRecording(false);
    const [t, b] = ERRORS[type];
    $('errTitle').textContent = t;
    $('errBody').textContent = b;
    $('err').hidden = false;
    clearStatus();
    render();
  }

  // ---- 録音（見た目だけ） ----
  function startRecording() {
    hideError();
    clearStatus();
    recording = true;
    $('interim').textContent = STEP[ui.step].interim;
    render();
  }
  function stopRecording(save) {
    const was = recording;
    recording = false;
    $('interim').textContent = '';
    render();
    if (was && save) saved();
  }
  function saved() {
    if (ui.step === 'diary') savedThisStep = true;
    render();
    showStatus(STEP[ui.step].saved);
  }

  $('rec').addEventListener('click', () => {
    if (ui.method === 'K') { openWrite($('rec')); return; }
    if (recording) { stopRecording(true); return; }
    if (ui.firstNight && !ui.permAsked) { $('perm').showModal(); return; }
    startRecording();
  });

  // ---- S4 文字で書く画面（夜の画面の中身と差し替える） ----
  // 空白と句読点だけなら「空」とみなす（区切りで分けると何も残らないため）
  const isEmpty = () => !$('text').value.replace(/[\s。、．，.,]+/g, '');
  function updateSave() { $('writeSave').setAttribute('aria-disabled', String(isEmpty())); }

  function openWrite(opener) {
    stopRecording(false);
    hideError();
    clearStatus();
    writeKind = ui.step === 'diary' ? 'diary' : 'azukeru';
    writeOpener = opener || $('textBtn');
    const s = STEP[writeKind];
    $('writeTitle').textContent = s.writeTitle;
    $('text').setAttribute('aria-label', s.writeAria);
    $('text').placeholder = s.placeholder;
    $('text').value = drafts[writeKind]; // 前に閉じたときの書きかけだけ。前に預けた文は出さない
    $('writeSave').textContent = s.writeSave;
    $('writeErr').textContent = '';
    $('kHint').hidden = ui.method !== 'K';
    $('kHelp').hidden = ui.method !== 'K';
    updateSave();
    $('screen').hidden = true;
    $('write').hidden = false;
    // iPhone でキーボードを出すため、タップの処理の中で focus する
    const t = $('text');
    t.focus();
    t.setSelectionRange(t.value.length, t.value.length);
  }
  function closeWrite(keepDraft) {
    drafts[writeKind] = keepDraft ? $('text').value : '';
    $('text').blur();
    $('write').hidden = true;
    $('screen').hidden = false;
    if (writeOpener) writeOpener.focus();
  }

  $('text').addEventListener('input', updateSave);
  $('writeClose').addEventListener('click', () => closeWrite(true)); // 書きかけは残す。確認は出さない
  $('writeSave').addEventListener('click', () => {
    $('writeErr').textContent = '';
    if (isEmpty()) { $('text').focus(); return; } // 空なら何もしない。文言も出さない
    if (ui.failSave) {
      // 保存できなかった：閉じない・文字は消さない・自動では消さない
      setTimeout(() => { $('writeErr').textContent = SAVE_FAILED; }, 0);
      return;
    }
    $('text').value = '';
    closeWrite(false);
    saved();
  });
  $('textBtn').addEventListener('click', () => openWrite($('textBtn')));
  $('errText').addEventListener('click', () => openWrite($('textBtn')));
  $('errClose').addEventListener('click', () => { hideError(); render(); });

  // ---- 許可の前 ----
  $('permGo').addEventListener('click', () => { ui.permAsked = true; $('perm').close(); startRecording(); });
  $('permText').addEventListener('click', () => { $('perm').close(); openWrite($('textBtn')); });

  // ---- 画面の移動 ----
  function goStep(step, entry) {
    stopRecording(false);
    hideError();
    clearStatus();
    if (!$('write').hidden) closeWrite(true);
    savedThisStep = false;
    ui.step = step;
    if (entry) ui.entry = entry;
    render();
    if (step === 'oyasumi') {
      const t = $('blackText');
      t.textContent = 'おやすみなさい';
      t.classList.remove('gone');
      clearTimeout(blackTimer);
      blackTimer = setTimeout(() => t.classList.add('gone'), 3000);
      $('black').dataset.tapped = '';
      $('black').focus();
    }
  }
  $('nextBtn').addEventListener('click', () => goStep(ui.step === 'diary' ? 'azukeru' : 'oyasumi'));
  $('diaryLink').addEventListener('click', () => goStep('diary', 'link'));
  $('morningBtn').addEventListener('click', () => showStatus('（モック）朝の画面へ移ります'));
  $('black').addEventListener('click', () => {
    const b = $('black');
    const t = $('blackText');
    if (!b.dataset.tapped) {
      b.dataset.tapped = '1';
      clearTimeout(blackTimer);
      t.textContent = 'また思い出したら、もう一度タップで戻れます';
      t.classList.remove('gone');
      blackTimer = setTimeout(() => t.classList.add('gone'), 3000);
    } else {
      goStep('azukeru');
    }
  });

  // ---- モックの操作 ----
  document.querySelectorAll('input[name="method"]').forEach((r) => r.addEventListener('change', () => {
    ui.method = r.value;
    stopRecording(false);
    render();
  }));
  $('firstNight').addEventListener('change', (e) => { ui.firstNight = e.target.checked; ui.permAsked = false; render(); });
  $('failSave').addEventListener('change', (e) => { ui.failSave = e.target.checked; });
  document.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
    goStep(b.dataset.step, b.dataset.step === 'diary' ? 'start' : undefined);
    if (b.dataset.step !== 'oyasumi') window.scrollTo(0, 0);
  }));
  document.querySelectorAll('[data-state]').forEach((b) => b.addEventListener('click', () => {
    if (ui.step === 'oyasumi') goStep('azukeru');
    if (!$('write').hidden) closeWrite(true);
    window.scrollTo(0, 0);
    const st = b.dataset.state;
    hideError();
    if (st === 'idle') { stopRecording(false); clearStatus(); savedThisStep = false; render(); }
    if (st === 'recording') { if (ui.method === 'K') { showStatus('方式K に録音中の表示はありません'); return; } startRecording(); }
    if (st === 'saved') { stopRecording(false); saved(); }
    if (st === 'nothing') { stopRecording(false); showStatus('聞き取れませんでした。もう一度タップしてください'); }
    if (st === 'sheet') openWrite($('textBtn'));
    if (st === 'perm') { stopRecording(false); $('perm').showModal(); }
    if (st === 'error') showError($('errType').value);
  }));

  render();
})();
</script>
</body>
</html>
